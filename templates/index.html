<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>SUB-GONE</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        body { 
            background-color: #1e1e1e; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px; 
            box-sizing: border-box;
            height: 100vh;          /* Zorgt dat de body exact zo hoog is als het scherm */
            overflow: hidden;       /* Verbergt de lelijke paginabrede scrolbalk */
            display: flex;
            flex-direction: column;
        }
        
        .header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .header img { max-width: 250px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        
        input, button { padding: 10px; margin-top: 10px; border-radius: 5px; border: none; font-size: 14px; }
        input[type="text"] { width: 300px; }
        
        .btn-start { background-color: #007bff; color: white; cursor: pointer; font-weight: bold; }
        .btn-start:hover { background-color: #0056b3; }
        .btn-stop { background-color: #dc3545; color: white; cursor: pointer; font-weight: bold; display: none; }
        .btn-stop:hover { background-color: #c82333; }
        
        /* Container voor knoppen rechtsboven */
        .top-right-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }

        /* Contact Knop Styling */
        .btn-contact { background-color: #17a2b8; color: white; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; padding: 10px 15px; border-radius: 5px; }
        .btn-contact:hover { background-color: #138496; }

        /* Donatie Knop Styling */
        .btn-donate { background-color: #ffc107; color: #212529; cursor: pointer; font-weight: bold; margin-left: 10px; text-decoration: none; display: inline-block; padding: 10px 15px; border-radius: 5px; }
        .btn-donate:hover { background-color: #e0a800; color: #111; }
        
        pre { 
            background: #333; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-y: auto;       /* Behoudt de scrolbalk uitsluitend voor de live-output */
            white-space: pre-wrap; 
            flex-grow: 1;           /* Zorgt dat dit veld de rest van de pagina netjes opvult */
            margin-bottom: 0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Knoppen Sectie Rechtsboven -->
    <div class="top-right-buttons">
        <a href="https://panda-creator-support-page.duckdns.org" target="_blank" class="btn-contact">{{ t.contact_btn }}</a>
        <a href="https://www.paypal.com/paypalme/PandaCreatorNL" target="_blank" class="btn-donate">👉 Buy me a coffee ☕</a>
    </div>

    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SUB-GONE Logo">
        <h2>{{ t.title }}</h2>
    </div>
    
    <p>{{ t.desc }}</p>
    <form id="scanForm">
        <input type="hidden" id="lang" name="lang" value="{{ lang }}">
        <input type="text" id="folder" name="folder" value="/media">
        <button type="submit" id="startBtn" class="btn-start">{{ t.start }}</button>
        <button type="button" id="stopBtn" class="btn-stop">{{ t.stop }}</button>
    </form>
    
    <h3>{{ t.live }}</h3>
    <pre id="output">{{ t.wait }}</pre>

    <script>
        let controller;

        // --- SCAN LOGICA ---
        async function startLogStream() {
            if (controller) controller.abort();
            controller = new AbortController();
            const outputBox = document.getElementById('output');
            
            try {
                const response = await fetch('/stream', { signal: controller.signal });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        document.getElementById('startBtn').style.display = 'inline-block';
                        document.getElementById('stopBtn').style.display = 'none';
                        break;
                    }
                    outputBox.innerText += decoder.decode(value);
                    outputBox.scrollTop = outputBox.scrollHeight;
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    outputBox.innerText += "\n{{ t.err }}";
                }
            }
        }

        window.onload = async function() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                if (data.running) {
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('output').innerText = "{{ t.recon }}\n";
                } else {
                    document.getElementById('output').innerText = "{{ t.hist }}\n";
                }
                startLogStream();
            } catch(e) {}
        };

        document.getElementById('scanForm').onsubmit = async function(e) {
            e.preventDefault();
            const outputBox = document.getElementById('output');
            outputBox.innerText = "";
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            
            const formData = new FormData();
            formData.append('folder', document.getElementById('folder').value);
            formData.append('lang', document.getElementById('lang').value);
            
            await fetch('/start', { method: 'POST', body: formData });
            startLogStream();
        };

        document.getElementById('stopBtn').onclick = async function() {
            const formData = new FormData();
            formData.append('lang', document.getElementById('lang').value);
            
            if (controller) controller.abort();
            await fetch('/stop', { method: 'POST', body: formData });
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        };
    </script>
</body>
</html>
